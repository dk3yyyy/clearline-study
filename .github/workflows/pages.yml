name: Deploy the study app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check site/assets/app.js
          node --check site/assets/scoring.js
          node --check site/assets/store.js
          node --check site/sw.js
      - name: Run the marking and storage tests
        run: node --test tests/*.test.mjs
      - name: Check quote-to-source grounding
        run: python3 scripts/audit_questions.py
      - name: Validate exported site data
        run: python3 scripts/validate_site.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
